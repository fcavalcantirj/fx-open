name: Sync upstream release

# Keeps this fork's `main` on the latest vercel-labs/fx RELEASE (tag), never on upstream dev:
# main := <latest release tag> + one commit carrying the fork's own files (README, openai-compat/, the skill).
# See openai-compat/sync-upstream.sh. Runs weekly and on demand.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure git identity
        run: |
          git config user.name "fx-open sync"
          git config user.email "fx-open-sync@users.noreply.github.com"
      - name: Sync main onto the latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./openai-compat/sync-upstream.sh --apply
