<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="fx-groq terminal session: a real tool round-trip on Groq">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="329" rx="12" fill="url(#bg)" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="759" height="36" rx="12" fill="#21262d"/>
  <rect x="0.5" y="24" width="759" height="13" fill="#21262d"/>
  <circle cx="22" cy="18.5" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18.5" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18.5" r="6" fill="#28c840"/>
  <text x="380" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8b949e">fx-groq — ~/project</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" xml:space="preserve">
    <text x="24" y="70" fill="#7ee787">$</text>
    <text x="44" y="70" fill="#e6edf3">fx-groq</text>
    <text x="24" y="98" fill="#c9d1d9">fx v0.0.5 · Run /help for commands</text>
    <text x="24" y="134" fill="#58a6ff">┃</text>
    <text x="44" y="134" fill="#e6edf3">Read input.txt. Create result.txt with the word uppercased followed by -FX.</text>
    <text x="44" y="166" fill="#8b949e">read_file  input.txt</text>
    <text x="260" y="166" fill="#7ee787">✓</text>
    <text x="44" y="190" fill="#8b949e">write_file result.txt</text>
    <text x="260" y="190" fill="#7ee787">✓</text>
    <text x="44" y="214" fill="#8b949e">read_file  result.txt</text>
    <text x="260" y="214" fill="#7ee787">✓</text>
    <text x="44" y="250" fill="#e6edf3">The file result.txt contains:</text>
    <text x="316" y="250" fill="#f2cc60" font-weight="bold">ALPHA-FX</text>
    <text x="24" y="300" fill="#8b949e">auto · gpt-oss-120b · Groq</text>
    <text x="736" y="300" text-anchor="end" fill="#484f58">4s · 3 tool calls</text>
  </g>
